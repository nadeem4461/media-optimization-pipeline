name: K8s Media Optimization Pipeline

on:
  pull_request:
    paths:
      - '**.jpg'
      - '**.jpeg'
      - '**.png'
      - '**.webp'

jobs:
  optimize-assets:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Deploy Kubernetes Job
        run: |
          # Delete the old job if it's stuck from a previous run
          kubectl delete job media-optimizer-job --ignore-not-found
          
          # Deploy the new job
          kubectl apply -f k8s/optimization-job.yaml

      - name: Wait for Job Completion & Print Logs
        run: |
          echo "⏳ Waiting for job to start..."
          # Wait up to 30 seconds for the pod to actually exist
          sleep 10
          
          POD_NAME=$(kubectl get pods --selector=job-name=media-optimizer-job --output=jsonpath='{.items[0].metadata.name}')
          
          if [ -z "$POD_NAME" ]; then
            echo "❌ Error: Pod never started."
            exit 1
          fi
          
          echo "✅ Pod found: $POD_NAME"
          
          echo "⏳ Waiting for pod to complete..."
          kubectl wait --for=condition=complete job/media-optimizer-job --timeout=120s || true
          
          echo "📜 Fetching Logs..."
          kubectl logs $POD_NAME
          
          # Check if the job actually succeeded
          JOB_STATUS=$(kubectl get job media-optimizer-job -o jsonpath='{.status.succeeded}')
          if [ "$JOB_STATUS" != "1" ]; then
            echo "❌ Job failed. See logs above."
            exit 1
          fi